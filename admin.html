<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>LMRA Admin v8.2</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
    
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-800 dark:text-slate-200 h-screen flex flex-col font-sans transition-colors duration-300">

    <header class="bg-white dark:bg-cardbg p-4 shadow-md border-b border-slate-200 dark:border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4 z-10">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="bg-blue-100 dark:bg-blue-900 text-blue-900 dark:text-blue-200 p-2 rounded"><i class="fa-solid fa-database"></i></div>
            <div>
                <h1 class="font-bold text-xl text-slate-800 dark:text-white">Rapportage Overzicht</h1>
                <p class="text-xs text-slate-400 font-mono">v8.2 Sentinel</p>
            </div>
        </div>
        
        <div class="flex-1 w-full md:w-auto max-w-md mx-4">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Zoeken..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                <div class="absolute left-3 top-2.5 text-slate-400"><i class="fa-solid fa-search"></i></div>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="btnToggleTheme" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-colors flex items-center justify-center">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <button id="btnExport" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center gap-2">
                <i class="fa-solid fa-file-excel"></i> <span class="hidden sm:inline">Excel</span>
            </button>
            <button id="btnLogout" class="bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 px-4 py-2 rounded-lg text-sm font-bold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-power-off"></i> <span class="hidden sm:inline">Uitloggen</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 overflow-auto bg-slate-50 dark:bg-slate-900">
        <div class="bg-white dark:bg-cardbg rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors">
            <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-700 uppercase text-xs sticky top-0 z-10 shadow-sm">
                    <tr>
                        <th class="p-4">Datum</th>
                        <th class="p-4">Monteur</th>
                        <th class="p-4">Locatie / WO</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 hidden md:table-cell w-1/3">Opmerkingen</th>
                        <th class="p-4 text-right">Opties</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>
            </table>
            <div id="loading" class="p-8 text-center text-slate-400 font-medium animate-pulse"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Data ophalen...</div>
            <div id="emptyState" class="hidden p-12 text-center text-slate-400 dark:text-slate-500"><i class="fa-solid fa-folder-open text-4xl mb-3 opacity-50"></i><p>Geen resultaten.</p></div>
        </div>
    </main>

    <script src="admin.js" defer></script>
</body>
</html>
