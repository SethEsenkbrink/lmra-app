<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMRA Admin - Beheer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full border border-slate-200">
            <div class="text-5xl text-blue-900 mb-6"><i class="fa-solid fa-user-shield"></i></div>
            <h1 class="text-2xl font-bold mb-2 text-slate-800">LMRA Pro Beheer</h1>
            <p class="text-slate-500 mb-8 text-sm">Beveiligde toegang voor veiligheidskundigen.</p>
            
            <button onclick="netlifyIdentity.open()" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-3 rounded-lg font-bold transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                Inloggen met Netlify ID
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white p-4 shadow-md border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 z-10">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 text-blue-900 p-2 rounded"><i class="fa-solid fa-database"></i></div>
                <h1 class="font-bold text-xl text-slate-800">Rapportage Overzicht</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="adminName" class="text-xs font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-600 border border-slate-200 hidden md:block"></span>
                <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors">
                    <i class="fa-solid fa-file-excel mr-2"></i> Excel
                </button>
                <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                    Uitloggen
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-6 overflow-auto bg-slate-50">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left text-sm border-collapse">
                    <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200 uppercase text-xs sticky top-0">
                        <tr>
                            <th class="p-4">Datum</th>
                            <th class="p-4">Monteur</th>
                            <th class="p-4">Locatie / WO</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 hidden md:table-cell w-1/3">Opmerkingen & Acties</th>
                            <th class="p-4 text-right">Opties</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
                <div id="loading" class="p-8 text-center text-slate-400">Bezig met laden...</div>
            </div>
        </main>
    </div>

    <script>
        let allData = [];

        // 1. INIT: Check login status bij laden
        document.addEventListener('DOMContentLoaded', () => {
            const user = netlifyIdentity.currentUser();
            if (user) {
                initDashboard(user);
            } else {
                netlifyIdentity.on('login', user => {
                    netlifyIdentity.close();
                    initDashboard(user);
                });
            }
        });

        function initDashboard(user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('adminName').innerText = user.email;
            loadReports(user);
        }

        function logout() {
            netlifyIdentity.logout();
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('tableBody').innerHTML = '';
        }

        // 2. DATA: Ophalen met beveiligde token
        async function loadReports(user) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                // Haal vers token op
                const token = await user.jwt();
                
                const response = await fetch('/.netlify/functions/get-reports', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    alert("Sessie verlopen. Log opnieuw in.");
                    logout();
                    return;
                }

                if (!response.ok) throw new Error("Server fout");

                const data = await response.json();
                allData = data;
                renderTable(data);
            } catch (e) {
                console.error(e);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Fout bij laden: ${e.message}</td></tr>`;
            } finally {
                loading.style.display = 'none';
            }
        }

        // 3. RENDER: Tabel opbouwen
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400 italic">Nog geen rapporten aanwezig.</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors group";
                
                // Status logic
                const statusBadge = row.is_veilig 
                    ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-[10px] font-bold border border-green-200 tracking-wider">VEILIG</span>'
                    : '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-[10px] font-bold border border-red-200 tracking-wider">ONVEILIG</span>';

                // Afkeurpunten parsen
                let failsHtml = '';
                if (!row.is_veilig && row.afkeurpunten) {
                    try {
                        const points = typeof row.afkeurpunten === 'string' ? JSON.parse(row.afkeurpunten) : row.afkeurpunten;
                        if(points.length > 0) {
                            failsHtml = `<ul class="mt-1 text-xs text-red-600 list-disc pl-4 bg-red-50 p-2 rounded border border-red-100">${points.map(p => `<li>${p}</li>`).join('')}</ul>`;
                        }
                    } catch(e) {}
                }

                // Opmerkingen
                const comments = row.opmerkingen && row.opmerkingen !== "Geen" 
                    ? `<div class="text-xs text-slate-500 italic mb-1">"${row.opmerkingen}"</div>` 
                    : '';

                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs text-slate-500 whitespace-nowrap">${new Date(row.created_at).toLocaleString('nl-NL')}</td>
                    <td class="p-4 font-bold text-slate-700">${row.monteur_naam}</td>
                    <td class="p-4">
                        <div class="text-sm font-medium text-slate-700">${row.locatie}</div>
                        <div class="text-xs text-slate-400 font-mono">${row.werkorder || '-'}</div>
                    </td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 hidden md:table-cell">
                        ${comments}
                        ${failsHtml}
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="deleteReport(${row.id})" class="text-slate-300 hover:text-red-600 transition-colors p-2 opacity-0 group-hover:opacity-100" title="Verwijderen">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. ACTION: Verwijderen
        async function deleteReport(id) {
            if(!confirm("Weet je zeker dat je dit rapport wilt verwijderen?")) return;
            
            const user = netlifyIdentity.currentUser();
            if(!user) return;

            try {
                const token = await user.jwt();
                const res = await fetch('/.netlify/functions/delete-report', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ id: id })
                });

                if (res.ok) {
                    loadReports(user); // Herladen
                } else {
                    alert("Kon niet verwijderen.");
                }
            } catch(e) {
                alert("Netwerkfout.");
            }
        }

        // 5. EXPORT: Excel
        function exportToExcel() {
            if (!allData.length) return alert("Geen data om te exporteren.");
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "LMRA Export");
            XLSX.writeFile(wb, `LMRA_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
