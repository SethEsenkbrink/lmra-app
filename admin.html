<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMRA Admin - Beheer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full border border-slate-200">
            <div class="text-5xl text-blue-900 mb-6"><i class="fa-solid fa-user-shield"></i></div>
            <h1 class="text-2xl font-bold mb-2 text-slate-800">LMRA Pro Beheer</h1>
            <p class="text-slate-50 mb-8 text-sm">Beveiligde toegang voor veiligheidskundigen.</p>
            
            <button id="loginBtn" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-3 rounded-lg font-bold transition-all shadow-lg">
                Inloggen met Netlify ID
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white p-4 shadow-md border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 z-10">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 text-blue-900 p-2 rounded"><i class="fa-solid fa-database"></i></div>
                <h1 class="font-bold text-xl text-slate-800">Rapportage Overzicht</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="adminName" class="text-xs font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-600 border border-slate-200 hidden md:block"></span>
                <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors">
                    <i class="fa-solid fa-file-excel mr-2"></i> Excel
                </button>
                <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                    Uitloggen
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-6 overflow-auto bg-slate-50">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left text-sm border-collapse">
                    <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200 uppercase text-xs sticky top-0">
                        <tr>
                            <th class="p-4">Datum</th>
                            <th class="p-4">Monteur</th>
                            <th class="p-4">Locatie / WO</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 hidden md:table-cell w-1/3">Opmerkingen & Acties</th>
                            <th class="p-4 text-right">Opties</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
                <div id="loading" class="p-8 text-center text-slate-400 hidden">Bezig met laden...</div>
            </div>
        </main>
    </div>

    <script>
        let allData = [];

        // --- AUTHENTICATIE LOGICA ---

        // Zorg dat Netlify Identity direct reageert (belangrijk voor wachtwoord resets via mail)
        if (window.netlifyIdentity) {
            // Event: Widget is klaar
            netlifyIdentity.on('init', user => {
                console.log('Identity Init:', user);
                if (user) {
                    initDashboard(user);
                } else {
                    // Als er geen user is, checken of we in een 'recovery' flow zitten via de URL
                    checkRecoveryMode();
                }
            });

            // Event: Succesvol ingelogd
            netlifyIdentity.on('login', user => {
                console.log('Ingelogd:', user);
                netlifyIdentity.close();
                initDashboard(user);
            });

            // Event: Uitgelogd
            netlifyIdentity.on('logout', () => {
                window.location.reload();
            });

            // Event: Foutmeldingen
            netlifyIdentity.on('error', err => {
                console.error('Identity Error:', err);
                alert("Er ging iets mis met inloggen: " + err.message);
            });

            // Initialiseer de widget
            netlifyIdentity.init({
                locale: 'nl' 
            });
        }

        // Koppel de inlogknop zodra de pagina geladen is
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.addEventListener('click', () => {
                    if (window.netlifyIdentity) {
                        netlifyIdentity.open();
                    } else {
                        alert("Het inlogsysteem wordt nog geladen. Probeer het zo nog eens.");
                    }
                });
            }
        });

        // Extra check voor recovery token in de URL
        function checkRecoveryMode() {
            if (window.location.hash.includes('recovery_token') && window.netlifyIdentity) {
                console.log("Recovery token gedetecteerd.");
                // De widget handelt dit meestal zelf af bij 'init', 
                // maar dit loggen helpt bij debuggen.
            }
        }

        // Functie die wordt aangeroepen na succesvolle login
        function initDashboard(user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            const adminNameEl = document.getElementById('adminName');
            if (adminNameEl) adminNameEl.innerText = user.email;
            
            loadReports(user);
        }

        // Uitlog functie
        function logout() {
            if (window.netlifyIdentity) netlifyIdentity.logout();
        }

        // --- DATA OPHALEN & VERWERKEN ---

        async function loadReports(user) {
            const loading = document.getElementById('loading');
            const tbody = document.getElementById('tableBody');
            
            if(loading) loading.classList.remove('hidden');
            if(tbody) tbody.innerHTML = ''; // Tabel leegmaken voor nieuwe data
            
            try {
                // Haal een vers JWT token op
                const token = await user.jwt();
                
                const response = await fetch('/.netlify/functions/get-reports', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) throw new Error("Sessie verlopen");
                if (!response.ok) throw new Error("Server fout bij ophalen data");

                const data = await response.json();
                allData = data; // Opslaan voor Excel export
                renderTable(data);
            } catch (e) {
                console.error(e);
                if(tbody) tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Fout: ${e.message}</td></tr>`;
                
                // Als de sessie verlopen is, log de gebruiker uit zodat ze opnieuw kunnen inloggen
                if(e.message === "Sessie verlopen") logout();
            } finally {
                if(loading) loading.classList.add('hidden');
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400 italic">Nog geen rapporten aanwezig.</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors group border-b border-slate-100 last:border-0";
                
                const statusBadge = row.is_veilig 
                    ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-[10px] font-bold border border-green-200 tracking-wider">VEILIG</span>'
                    : '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-[10px] font-bold border border-red-200 tracking-wider">ONVEILIG</span>';

                let failsHtml = '';
                if (!row.is_veilig && row.afkeurpunten) {
                    try {
                        const points = typeof row.afkeurpunten === 'string' ? JSON.parse(row.afkeurpunten) : row.afkeurpunten;
                        if(points.length > 0) {
                            failsHtml = `<ul class="mt-1 text-xs text-red-600 list-disc pl-4 bg-red-50 p-2 rounded border border-red-100">${points.map(p => `<li>${p}</li>`).join('')}</ul>`;
                        }
                    } catch(e) {
                        console.warn("Fout bij parsen afkeurpunten", e);
                    }
                }

                const comments = row.opmerkingen && row.opmerkingen !== "Geen" 
                    ? `<div class="text-xs text-slate-500 italic mb-1">"${row.opmerkingen}"</div>` 
                    : '';

                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs text-slate-500 whitespace-nowrap">${new Date(row.created_at).toLocaleString('nl-NL')}</td>
                    <td class="p-4 font-bold text-slate-700">${row.monteur_naam}</td>
                    <td class="p-4">
                        <div class="text-sm font-medium text-slate-700">${row.locatie}</div>
                        <div class="text-xs text-slate-400 font-mono">${row.werkorder || '-'}</div>
                    </td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 hidden md:table-cell">
                        ${comments}
                        ${failsHtml}
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="deleteReport(${row.id})" class="text-slate-300 hover:text-red-600 transition-colors p-2 opacity-0 group-hover:opacity-100" title="Verwijderen">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteReport(id) {
            if(!confirm("Weet je zeker dat je dit rapport wilt verwijderen?")) return;
            
            // Check voor user
            const user = window.netlifyIdentity ? netlifyIdentity.currentUser() : null;
            if(!user) return;

            try {
                const token = await user.jwt();
                const res = await fetch('/.netlify/functions/delete-report', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ id: id })
                });

                if (res.ok) {
                    loadReports(user); // Herlaad tabel
                } else {
                    alert("Kon niet verwijderen. Mogelijk geen rechten.");
                }
            } catch(e) {
                alert("Netwerkfout bij verwijderen.");
            }
        }

        function exportToExcel() {
            if (!allData || allData.length === 0) return alert("Geen data om te exporteren.");
            
            // Maak een nette export set (overbodige ID's weglaten indien gewenst)
            const exportData = allData.map(item => ({
                Datum: new Date(item.created_at).toLocaleString('nl-NL'),
                Monteur: item.monteur_naam,
                Locatie: item.locatie,
                Werkorder: item.werkorder,
                Status: item.is_veilig ? 'Veilig' : 'Onveilig',
                Opmerkingen: item.opmerkingen,
                Afkeurpunten: item.afkeurpunten // Dit blijft ruwe data/JSON
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "LMRA Export");
            XLSX.writeFile(wb, `LMRA_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
