<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord Instellen - LMRA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full border border-slate-200">
        <div class="text-4xl text-blue-900 mb-4"><i class="fa-solid fa-key"></i></div>
        <h1 class="text-xl font-bold mb-2 text-slate-800">Wachtwoord Instellen</h1>
        <p class="text-slate-500 text-sm mb-6">Het beveiligde venster wordt geopend...</p>
        
        <button id="openBtn" class="bg-blue-900 text-white px-4 py-2 rounded text-sm font-bold hidden">
            Klik hier als er niets gebeurt
        </button>
    </div>

    <script>
        // 1. Zodra de pagina laadt, open de widget
        if (window.netlifyIdentity) {
            
            // Luister of de gebruiker succesvol inlogt (na wachtwoord reset)
            netlifyIdentity.on('login', user => {
                console.log("Wachtwoord ingesteld/Ingelogd!", user);
                // STUUR DOOR NAAR DE ECHTE ADMIN PAGINA
                window.location.replace('/admin.html');
            });

            netlifyIdentity.init({
                locale: 'nl' // Nederlands
            });

            // Open direct de widget zodat de gebruiker het reset-scherm ziet
            // De widget herkent zelf de #recovery_token in de URL
            netlifyIdentity.open();
        }

        // Toon fallback knop na 3 seconden voor de zekerheid
        setTimeout(() => {
            document.getElementById('openBtn').classList.remove('hidden');
        }, 3000);

        document.getElementById('openBtn').addEventListener('click', () => {
            netlifyIdentity.open();
        });
    </script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</body>
</html>
