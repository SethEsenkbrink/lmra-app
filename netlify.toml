[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 1. App Routing: Zorg dat /app netjes naar app.html (de software) gaat
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

# 2. Juridische pagina's
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/voorwaarden"
  to = "/voorwaarden.html"
  status = 200

# 3. Kennisbank en contentpaginas worden door Netlify automatisch zonder
#    .html-extensie geserveerd. Er staat GEEN catch-all naar index.html meer:
#    die slokte nieuwe paginas op en leverde soft-404s op voor Google.
#    Onbekende URLs komen op 404.html terecht.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy (CSP) geoptimaliseerd voor PWA, GPS, Weer, Camera & Google Analytics
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self' data:; media-src 'self' blob:; worker-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://api.open-meteo.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com;"
    
    # Permissions-Policy: Sta camera, microfoon en GPS toe voor deze app
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=()"