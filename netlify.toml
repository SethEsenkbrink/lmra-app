# Netlify Configuratie v8.2 - Sentinel (Secure Token Auth)

[build]
  publish = "."
  functions = "netlify/functions"

# --- EDGE SECURITY LAYERS ---

# 1. Beveilig de admin pagina (de 'voordeur')
[[edge_functions]]
  path = "/admin.html"
  function = "auth"

# 2. Beveilig de functie die data ophaalt
[[edge_functions]]
  path = "/.netlify/functions/get-reports"
  function = "auth"

# 3. Beveilig de functie die data verwijdert
[[edge_functions]]
  path = "/.netlify/functions/delete-report"
  function = "auth"

# 4. RATE LIMITING (NIEUW: Audit Fix Stap 3)
# Deze Edge Function draait VOOR de backend submit functie.
[[edge_functions]]
  function = "submit-limiter"
  path = "/.netlify/functions/submit-lmra"
  
  [edge_functions.rate_limit]
    window = "1m" # Per minuut
    limit = 10    # Max 10 rapporten (beschermt tegen DoS/Spam)
    aggregate_by = "ip" # Per IP adres

# --- HEADERS ---
[[headers]]
  for = "/*"
  [headers.values]
    # CSP: 'unsafe-inline' is verwijderd bij script-src voor maximale veiligheid
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https://placehold.co; connect-src 'self' https://api.open-meteo.com https://*.nsvcs.net;"
    X-XSS-Protection = "1; mode=block"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"