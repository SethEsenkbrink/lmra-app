[build]
  publish = "."

# Beveiligingsheaders (Sentinel Safe Configuration v9.1)
[[headers]]
  for = "/*"
  [headers.values]
    # CSP Update: 'connect-src' uitgebreid zodat PDF-tools en Supabase altijd werken zonder rode foutmeldingen.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https://placehold.co; connect-src 'self' https://*.supabase.co https://*.supabase.in https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; upgrade-insecure-requests;"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"