# Netlify Configuratie v6.4

[[headers]]
  for = "/*"
  [headers.values]
    # CSP:
    # - script-src: Sta tailwind en andere CDNs toe. 'unsafe-inline' is nodig voor Tailwind CDN werking.
    # - style-src: 'unsafe-inline' nodig voor Tailwind.
    # - font-src: Specifiek cdnjs toestaan voor FontAwesome icoontjes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com;"
    X-XSS-Protection = "1; mode=block"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
