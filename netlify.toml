# Netlify Configuratie v8.2 - Sentinel (Fixed)

[build]
  publish = "."
  functions = "netlify/functions"

# 1. Beveilig de admin pagina (de 'voordeur')
[[edge_functions]]
  path = "/admin.html"
  function = "auth"

# 2. Beveilig de functie die data ophaalt
[[edge_functions]]
  path = "/.netlify/functions/get-reports"
  function = "auth"

# 3. Beveilig de functie die data verwijdert
[[edge_functions]]
  path = "/.netlify/functions/delete-report"
  function = "auth"

# 4. De Limiter functie koppelen (Zonder de 'rate_limit' property die de fout veroorzaakt)
[[edge_functions]]
  function = "submit-limiter"
  path = "/.netlify/functions/submit-lmra"

# Beveiligingsheaders voor de hele site (Hardened v8.2)
[[headers]]
  for = "/*"
  [headers.values]
    # CSP: Strict policy. Sta alleen vertrouwde bronnen toe.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https://placehold.co; frame-src 'self' https://identity.netlify.com; connect-src 'self' https://api.open-meteo.com https://*.nsvcs.net https://identity.netlify.com; upgrade-insecure-requests;"
    
    # Voorkomt MIME-type sniffing (beschermt tegen vermomde bestanden)
    X-Content-Type-Options = "nosniff"
    
    # Verbiedt het laden van de site in een iFrame (tegen Clickjacking)
    X-Frame-Options = "DENY"
    
    # Activeert XSS filtering in oude browsers (extra vangnet)
    X-XSS-Protection = "1; mode=block"
    
    # Forceer HTTPS voor 1 jaar (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Privacy: Stuur geen referer info mee naar andere domeinen
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Moderne browser features uitschakelen die we niet gebruiken (Privacy)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"