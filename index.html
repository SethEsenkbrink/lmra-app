<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMRA Pro 8.2</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23005596'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00447c">
     
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-900 dark:text-slate-200 h-screen flex flex-col transition-colors duration-300">
    <header class="bg-[#00447c] text-white p-4 shadow-lg flex justify-between items-center z-50 sticky top-0 border-b border-[#002a4d]">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 p-2 rounded-lg border border-white/30 shadow-sm backdrop-blur-sm">
                <i class="fa-solid fa-shield-halved text-xl text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide text-white">LMRA <span class="text-blue-200">PRO</span></h1>
                <p class="text-[10px] uppercase tracking-wider opacity-90 font-semibold text-blue-100">v8.2 - Sentinel (Supabase)</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="btnOpenArchive" aria-label="Open Historie" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 active:bg-white/30 flex items-center justify-center transition-all border border-white/20 text-white shadow-sm">
                <i class="fa-solid fa-folder-open"></i>
            </button>
            <button id="btnToggleTheme" aria-label="Wissel Thema" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 active:bg-white/30 flex items-center justify-center transition-all border border-white/20 text-white shadow-sm">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <button id="btnResetApp" aria-label="Reset Formulier" class="w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 active:bg-red-700 flex items-center justify-center transition-all text-white shadow-md border border-red-700 hover:scale-105">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-28 max-w-3xl mx-auto w-full" id="main-container">
        <div id="securityOverlay" class="hidden"></div>

        <div id="pauseAlert" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-4 rounded-r shadow-sm">
            <div class="flex">
                <div class="flex-shrink-0"><i class="fa-solid fa-clock text-red-500"></i></div>
                <div class="ml-3">
                    <p class="text-sm text-red-800 font-bold">Geldigheid Verlopen</p>
                    <p class="text-xs text-red-700 mt-1">Start een nieuwe check.</p>
                </div>
            </div>
        </div>

        <div class="bg-white dark:bg-cardbg rounded-xl shadow-sm p-5 mb-5 border-l-4 border-[#00447c] transition-colors">
            <h2 class="font-bold text-slate-800 dark:text-slate-200 mb-4 flex items-center text-sm uppercase tracking-wider"><i class="fa-solid fa-id-card mr-2 text-[#00447c] dark:text-blue-400"></i>Werkgegevens</h2>
            
            <div class="hidden" aria-hidden="true">
                <label for="contact_email">Laat dit veld leeg</label>
                <input type="text" id="contact_email" name="contact_email" tabindex="-1" autocomplete="off">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-400 uppercase mb-1">Monteur *</label>
                    <input type="text" id="userName" maxlength="50" autocorrect="off" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm focus:border-[#00447c] focus:ring-2 focus:ring-[#00447c]/20 outline-none transition-all dark:text-white font-medium" placeholder="Naam" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-400 uppercase mb-1">Locatie / Asset *</label>
                    <input type="text" id="taskLocation" maxlength="50" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm focus:border-[#00447c] focus:ring-2 focus:ring-[#00447c]/20 outline-none transition-all dark:text-white font-medium" placeholder="Bijv. E-Motor 401" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-400 uppercase mb-1">Werkorder Nr.</label>
                    <input type="text" id="workOrder" maxlength="20" inputmode="text" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm focus:border-[#00447c] focus:ring-2 focus:ring-[#00447c]/20 outline-none transition-all dark:text-white font-medium" placeholder="Bijv. WO-2025-A">
                </div>
                
                <div class="md:col-span-2 grid grid-cols-2 gap-4 pt-2 mt-2 border-t border-slate-200 dark:border-slate-700">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-400 uppercase mb-1">Starttijd *</label>
                        <input type="time" id="timeStart" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm outline-none dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-400 uppercase mb-1">Geldig tot *</label>
                        <input type="time" id="timeEnd" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm outline-none dark:text-white" required>
                    </div>
                </div>

                <div class="md:col-span-2 pt-3 border-t border-slate-200 dark:border-slate-700 mt-2 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-700 dark:text-slate-400 uppercase">Buddy Check</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="buddyToggle" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#00447c]"></div>
                        </label>
                    </div>
                    <div id="buddyField" class="hidden mt-1 animate-fade-in">
                        <input type="text" id="buddyName" maxlength="50" class="w-full bg-blue-50 dark:bg-slate-800/50 border border-blue-200 dark:border-slate-600 rounded-lg p-3 text-sm outline-none dark:text-white" placeholder="Naam Buddy">
                    </div>
                </div>
            </div>
        </div>
        
        <div id="questions-container" class="space-y-6"></div>
        
        <div class="mt-6 bg-white dark:bg-cardbg rounded-xl shadow-sm p-4 transition-colors">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-400 uppercase mb-2">Opmerkingen</label>
            <textarea id="comments" rows="2" maxlength="200" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm focus:border-[#00447c] focus:ring-2 focus:ring-[#00447c]/20 outline-none transition-all dark:text-white" placeholder="Bijv: Extra aardlekschakelaar geplaatst..."></textarea>
        </div>

        <div class="mt-4 flex items-center gap-3 p-4 bg-blue-50 dark:bg-slate-800 border border-blue-100 dark:border-slate-700 rounded-lg">
            <input type="checkbox" id="declarationCheck" class="w-5 h-5 text-[#00447c] border-gray-300 rounded focus:ring-[#00447c]">
            <label for="declarationCheck" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
                Ik verklaar dat ik deze LMRA naar waarheid heb ingevuld en de risico's begrijp.
            </label>
        </div>
        
        <div class="text-center mt-8 mb-4 text-[10px] text-slate-400">
            <p>Data verwerkt via Supabase.</p>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-100 via-slate-100 to-transparent dark:from-darkbg dark:via-darkbg z-10">
        <button id="submitBtn" class="max-w-3xl mx-auto w-full bg-[#00447c] hover:bg-[#003366] text-white font-bold py-4 rounded-xl shadow-lg shadow-[#00447c]/30 active:scale-[0.98] transition-all flex items-center justify-center gap-3 text-lg uppercase tracking-wide">
            <i class="fa-solid fa-clipboard-check text-xl"></i> <span id="submitBtnText">Beoordeel Veiligheid</span>
        </button>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
